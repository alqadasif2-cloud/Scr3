# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured in this file will override any Gradle settings
# configured in the Android Studio's Settings/Preferences dialog.

# Enable AndroidX support
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Suppress compileSdk 35 warning with AGP 8.5.2
android.suppressUnsupportedCompileSdk=35

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use official Kotlin code style
kotlin.code.style=official

# Optimizations
org.gradle.parallel=true
org.gradle.caching=true
